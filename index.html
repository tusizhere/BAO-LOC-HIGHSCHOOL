<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5A2E86">
<title>THPT Bảo Lộc · Cổng truy cập</title>
<meta name="description" content="Cổng truy cập nhanh Trường THPT Bảo Lộc – sổ thi đua, theo dõi học sinh, tổ chuyên môn, thời khóa biểu.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THPT BẢO LỘC — style caro tím (theo bản Canva)
   Sửa link ở phần CONFIG trong <script> cuối file.
   ========================================================= */
:root{
  --ink:#111;
  --p1:#4E2A78;   /* tím đậm */
  --p2:#8A5CB8;   /* tím vừa */
  --p3:#DDBDFB;   /* tím nhạt */
  --yellow:#FFD744;
  --cyan:#5BD2FF;
  --orange:#FF8F52;
  --pink:#F7B1DF;
  --lav:#9D8BEE;
  --green:#3FAA6E;
  --lemon:#FFDF5A;
  --lime:#C2FF6E;
  --red:#E8323C;
  --line:3px solid var(--ink);
  --title:'Anton','Lexend',Impact,sans-serif;
  --body:'Lexend',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);font-size:18px;color:var(--ink);min-height:100vh;
  /* nền caro tím */
  background-color:var(--p3);
  background-image:
    linear-gradient(90deg,rgba(78,42,120,.55) 50%,transparent 50%),
    linear-gradient(rgba(78,42,120,.55) 50%,transparent 50%);
  background-size:120px 120px;
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:620px;margin:0 auto;padding:16px 14px 40px;display:flex;flex-direction:column;gap:26px}

/* ---------- BANNER VÀNG (giống bản Canva) ---------- */
.banner{position:relative;display:flex;align-items:center;margin-left:14px}
.banner .chk{
  position:absolute;left:-14px;top:50%;transform:translateY(-50%) rotate(-4deg);z-index:2;
  width:66px;height:66px;background:var(--pink);border:var(--line);display:grid;place-items:center;
}
.banner .chk svg{width:48px;height:48px}
.banner h2{
  flex:1;background:var(--yellow);border:var(--line);border-radius:6px;padding:12px 14px 10px 66px;
  font-family:var(--title);font-weight:400;font-size:clamp(1.6rem,7vw,2.3rem);line-height:1.05;letter-spacing:.5px;text-transform:uppercase;
  box-shadow:5px 5px 0 var(--ink);
}
.spark{position:absolute;left:-24px;top:-18px;width:44px;z-index:3;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.85) rotate(-8deg)}}

/* ---------- HEADER ---------- */
.head{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px}
.logo{width:110px;height:110px;border-radius:50%;border:var(--line);object-fit:cover;box-shadow:4px 4px 0 var(--ink);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.school{
  background:var(--yellow);border:var(--line);border-radius:999px;padding:8px 26px 6px;box-shadow:5px 5px 0 var(--ink);
  font-family:var(--title);font-size:clamp(2.2rem,11vw,3.2rem);line-height:1.05;letter-spacing:1px;color:#D7263D;text-align:center;
  -webkit-text-stroke:1.5px var(--ink);
}
.clock{display:inline-flex;gap:8px;align-items:center;background:#fff;border:var(--line);border-radius:999px;padding:5px 14px;font-weight:600;font-size:1rem}
.clock i{width:10px;height:10px;border-radius:50%;background:var(--green);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- CẢNH BẢO LỘC ---------- */
.frame{border:var(--line);border-radius:10px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:#fff}
.scene{display:block;width:100%;height:auto}

/* ---------- NÚT MÀU ---------- */
.btns{display:grid;gap:14px}
.btn{
  position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:68px;padding:12px 16px;
  background:var(--c);border:var(--line);border-radius:6px;box-shadow:4px 4px 0 var(--ink);
  font-weight:500;font-size:1.25rem;line-height:1.25;text-transform:uppercase;
  text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;
  transition:transform .1s,box-shadow .1s;
}
.btn:hover,.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.icon{justify-content:flex-start;gap:14px;text-align:left;padding-left:12px}
.btn .ic{width:48px;height:48px;flex-shrink:0;background:#fff;border:var(--line);border-radius:6px;display:grid;place-items:center;text-decoration:none}
.btn .ic svg{width:34px;height:34px}
.btn.soon{opacity:.6}
.btn.soon::after{content:"SẮP CÓ";position:absolute;top:-10px;right:10px;font-size:.7rem;font-weight:700;background:var(--red);color:#fff;border:2px solid var(--ink);padding:1px 6px;text-decoration:none}

/* ---------- CHỌN VAI ---------- */
[hidden]{display:none!important}
.vai{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vai button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;background:var(--c);border:var(--line);border-radius:6px;box-shadow:4px 4px 0 var(--ink);font:700 1rem var(--body);text-transform:uppercase;cursor:pointer;opacity:.55;transition:.1s}
.vai button b{font-size:1.8rem;line-height:1}
.vai button.on{opacity:1;transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);outline:3px solid var(--yellow);outline-offset:2px}
.vai:not(:has(.on)) button{opacity:1}
.goiy{margin-top:12px;text-align:center;font-weight:700;color:#fff;text-shadow:1px 1px 0 var(--ink)}

/* ---------- MENU THẢ XUỐNG ---------- */
.drop>summary{list-style:none;cursor:pointer}
.drop>summary::-webkit-details-marker{display:none}
.drop>summary .lb{flex:1}
.drop>summary .mui{display:inline-block;font-size:1.4rem;text-decoration:none;transition:transform .2s}
.drop[open]>summary .mui{transform:rotate(180deg)}
.drop[open]>summary{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- SỔ THI ĐUA ---------- */
.bgh{margin-left:8px;padding:0 2px;font-size:1.05rem;text-decoration:none;text-shadow:none;opacity:.85;display:inline-block;transition:transform .15s}
.bgh:hover,.bgh:active{opacity:1;transform:scale(1.3) rotate(-10deg)}

@media(min-width:560px){ .two{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);grid-auto-flow:column} }

/* ---------- DẢI MŨI TÊN + NÚT ĐỎ ---------- */
.callout{display:flex;align-items:center;gap:8px}
.arrows{flex:1;display:flex;gap:3px;overflow:hidden;height:20px}
.arrows span{width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;flex-shrink:0;animation:flick 1.2s infinite}
.arrows.r span{border-left:14px solid #fff}
.arrows.l{justify-content:flex-end}
.arrows.l span{border-right:14px solid #fff}
@keyframes flick{50%{opacity:.25}}
.red{
  flex-shrink:0;max-width:62%;background:var(--red);color:#fff;border:var(--line);border-radius:6px;padding:10px 12px;
  font-weight:700;font-size:.95rem;line-height:1.25;text-transform:uppercase;text-align:center;box-shadow:3px 3px 0 var(--ink);transition:.1s
}
.red:hover,.red:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- LỚP HỌC ---------- */
.panel{background:rgba(255,255,255,.92);border:var(--line);border-radius:8px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tabs button{padding:12px;border:var(--line);border-radius:6px;background:#fff;font-weight:700;font-size:1.1rem;text-transform:uppercase}
.tabs button.on{background:var(--p1);color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.search{display:flex;align-items:center;gap:8px;border:var(--line);border-radius:6px;padding:0 12px;background:#fff;margin-bottom:14px}
.search input{flex:1;border:0;outline:0;padding:13px 0;font:500 1.05rem var(--body);background:none;min-width:0}
.search:focus-within{box-shadow:0 0 0 4px var(--yellow)}
.khoi{margin-bottom:16px}
.khoi h3{font-family:var(--title);font-weight:400;font-size:1.5rem;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.khoi h3 span{font-family:var(--body);font-size:.8rem;font-weight:600;background:var(--c);border:2px solid var(--ink);padding:1px 8px;border-radius:4px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{padding:12px 0;text-align:center;font-weight:700;font-size:1.1rem;background:var(--c);border:2.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);transition:.1s}
.key:hover,.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.key.nolink{opacity:.45;box-shadow:none;border-style:dashed}
.k10{--c:var(--cyan)} .k11{--c:var(--pink)} .k12{--c:var(--lime)}
.empty{text-align:center;font-weight:600;padding:10px}

/* ---------- LIÊN HỆ ---------- */
.contact{display:grid;gap:14px}
.cp{background:#fff;border:var(--line);border-radius:8px;padding:14px;box-shadow:4px 4px 0 var(--ink)}
.cp h3{font-family:var(--title);font-weight:400;font-size:1.5rem;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:inline-block;background:var(--c);border:2px solid var(--ink);padding:0 10px}
.cp p{font-size:1.02rem;line-height:1.75}
.cp a{text-decoration:underline;text-underline-offset:3px}
.foot{text-align:center;color:#fff;font-weight:600;font-size:.9rem;text-shadow:1px 1px 0 var(--ink)}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:70;background:var(--yellow);border:var(--line);border-radius:6px;box-shadow:4px 4px 0 var(--ink);padding:10px 16px;font-weight:700;transition:.2s;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- ANIMATION CẢNH ---------- */
.cl{animation:cloud linear infinite}
.cl1{animation-duration:46s;animation-delay:-10s}.cl2{animation-duration:62s;animation-delay:-40s}.cl3{animation-duration:54s;animation-delay:-25s}
@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(420px)}}
.sun{animation:glow 3s ease-in-out infinite alternate;transform-origin:262px 104px}
@keyframes glow{to{transform:scale(1.04)}}
.tw{animation:tw 1.4s steps(2) infinite}.tw.d{animation-delay:.7s}
@keyframes tw{50%{opacity:0}}
.water{stroke-dasharray:6 7;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
.splash{animation:tw .8s steps(2) infinite}
.mist{animation:mist 10s ease-in-out infinite alternate}.mist.b{animation-duration:14s;animation-direction:alternate-reverse}
@keyframes mist{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
.flag{transform-origin:0 50%;transform-box:fill-box;animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewY(-7deg) scaleX(.92)}to{transform:skewY(5deg)}}
.bird{animation:fly 18s linear infinite}.bird.b{animation-duration:24s;animation-delay:-9s}
@keyframes fly{from{transform:translate(-40px,0)}50%{transform:translate(170px,-8px)}to{transform:translate(420px,4px)}}
.wing{transform-origin:center;transform-box:fill-box;animation:flap .35s steps(2) infinite}
@keyframes flap{50%{transform:scaleY(-.5)}}
.pine{transform-origin:bottom center;transform-box:fill-box;animation:sway 3.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.lite{animation:lite 3s steps(1) infinite}
@keyframes lite{0%,55%{fill:#FFD84D}56%,100%{fill:#FBF7FF}}
.bus{offset-path:path("M-30 226 C 40 214, 70 204, 120 206 S 200 214, 236 200 S 300 186, 390 192");animation:drive 11s linear infinite;offset-rotate:auto}
@keyframes drive{from{offset-distance:0%}to{offset-distance:100%}}
.wheel{transform-origin:center;transform-box:fill-box;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:360px){.keys{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

  calendar:`<svg viewBox="0 0 40 40"><rect x="6" y="9" width="28" height="25" rx="2" fill="#fff" stroke="#111" stroke-width="3"/><path d="M6 16h28" ${S}/><path d="M13 5v7M27 5v7" ${S}/><path d="M12 22h4M18 22h4M24 22h4M12 28h4M18 28h4" stroke="#111" stroke-width="3.5"/></svg>`,
  down:`<svg viewBox="0 0 40 40"><path d="M14 6h12v14h7L20 34 7 20h7z" fill="#FFD744" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg>`,
  note:`<svg viewBox="0 0 40 40"><rect x="8" y="6" width="24" height="28" rx="2" fill="#fff" stroke="#111" stroke-width="3"/><path d="M8 12h24" ${S}/><path d="M13 19h14M13 25h14M13 30h8" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg>`
};

/* ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ext=h=>/^https?:/.test(h);
const lk=h=>h?`href="${esc(h)}"${ext(h)?' target="_blank" rel="noopener"':''}`:'href="#" data-soon="1"';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

$('#menu').innerHTML=CONFIG.menu.map(m=>
  `<a class="btn icon${m.href?'':' soon'}" data-ai="${m.ai}" style="--c:var(${m.color})" ${lk(m.href)}><span class="ic">${ICONS[m.icon]}</span>${esc(m.label)}</a>`).join('');
$('#tcmList').innerHTML=CONFIG.toChuyenMon.map(t=>
  `<a class="btn" style="--c:var(${t.color})" ${lk(t.href)}>${esc(t.name)}</a>`).join('');
$('#tdList').innerHTML=CONFIG.thiDua.nut.map(m=>{const h=CONFIG.thiDua.web+(m.vai?'?vai='+m.vai:'');
  return `<a class="btn icon" data-ai="${m.ai}" style="--c:var(${m.color})" ${lk(h)}><span class="ic">${ICONS[m.icon]}</span>${esc(m.label)}</a>`}).join('');
$('#bgh').href=CONFIG.thiDua.web+'?vai=bgh';
$('#dkHS').href=CONFIG.formHS; $('#dkTCM').href=CONFIG.formTCM;

/* mũi tên trắng */
document.querySelectorAll('.arrows').forEach((a,j)=>{a.innerHTML=Array.from({length:12},(_,i)=>`<span style="animation-delay:${(a.classList.contains('r')?i:11-i)*.08}s"></span>`).join('')});

/* lớp */
let cs='cs1';
function renderClasses(){
  const q=$('#q').value.trim().toUpperCase().replace(/\s/g,''),L=cs==='cs1'?'A':'B';
  let h='';
  for(const k of [10,11,12]){
    const list=Array.from({length:11},(_,i)=>`${k}${L}${i+1}`).filter(c=>!q||c.includes(q));
    if(!list.length)continue;
    h+=`<div class="khoi k${k}"><h3>KHỐI ${k} <span>${list.length} lớp</span></h3><div class="keys">`+
      list.map(c=>{const u=(CONFIG.classLinks[cs]||{})[c];return `<a class="key${u?'':' nolink'}" ${lk(u)}>${c}</a>`}).join('')+`</div></div>`;
  }
  $('#classWrap').innerHTML=h||`<p class="empty">Không tìm thấy lớp “${esc(q)}”</p>`;
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));cs=b.dataset.cs;renderClasses()});
$('#q').addEventListener('input',renderClasses);renderClasses();

/* liên hệ */
$('#contact').innerHTML=CONFIG.campuses.map(c=>`<div class="cp" style="--c:var(${c.color})"><h3>${c.name}</h3><p>📍 ${esc(c.addr)}<br>☎️ <a href="tel:${c.phone.replace(/\s/g,'')}">${esc(c.phone)}</a><br>✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p></div>`).join('');
/* chọn vai: chỉ hiện mục của vai đó, nhớ lựa chọn trên máy */
function chonVai(v){
  document.querySelectorAll('#vai button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('[data-ai]').forEach(e=>e.hidden=!v||!e.dataset.ai.split(' ').includes(v));
  $('#goiy').hidden=!!v;
  try{v?localStorage.setItem('vai',v):localStorage.removeItem('vai')}catch(e){}
}
$('#vai').addEventListener('click',e=>{const b=e.target.closest('button');if(b)chonVai(b.dataset.v)});
let vaiDaChon='';try{vaiDaChon=localStorage.getItem('vai')||''}catch(e){}
chonVai(vaiDaChon);
$('#yr').textContent=new Date().getFullYear();

const D=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
function tick(){const d=new Date();$('#clock').textContent=`${D[d.getDay()]}, ${d.toLocaleDateString('vi-VN')} · ${d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}`}
tick();setInterval(tick,15000);

document.addEventListener('click',e=>{if(e.target.closest('[data-soon]')){e.preventDefault();toast('Link đang cập nhật…')}});
</script>
</body>
</html>
